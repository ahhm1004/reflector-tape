const STORE_KEY = 'lhw_internal_pw_v1';

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function tryDecrypt(pw) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('브라우저 보안 컨텍스트(HTTPS 또는 localhost)에서 열어 주세요.');
  }
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const aesKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(ENC_CFG.s), iterations: ENC_CFG.it, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const buf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(ENC_CFG.iv) },
    aesKey,
    b64ToBytes(ENC_CFG.ct)
  );
  return new TextDecoder().decode(buf);
}

async function unlockWith(pw, fromCache) {
  const btn = document.getElementById('unlockBtn');
  const err = document.getElementById('errBox');
  btn.disabled = true;
  err.textContent = fromCache ? '세션 키로 복호화 중...' : '복호화 확인 중...';
  try {
    const html = await tryDecrypt(pw);
    try { sessionStorage.setItem(STORE_KEY, pw); } catch (_) {}
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    btn.disabled = false;
    if (fromCache) {
      try { sessionStorage.removeItem(STORE_KEY); } catch (_) {}
      err.textContent = '';
    } else {
      err.textContent = (e && e.message && e.message.includes('보안 컨텍스트'))
        ? e.message
        : '비밀번호가 올바르지 않습니다.';
    }
  }
}

document.getElementById('unlockForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const pw = document.getElementById('pwInput').value;
  if (pw) unlockWith(pw, false);
});

try {
  const cached = sessionStorage.getItem(STORE_KEY);
  if (cached) unlockWith(cached, true);
} catch (_) {}

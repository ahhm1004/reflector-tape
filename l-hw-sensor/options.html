<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .lock-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 64px;
  }
  .lock-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 26px 24px;
    box-shadow: 0 2px 10px rgba(17, 24, 39, 0.04);
  }
  .lock-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .lock-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface-subtle);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .lock-icon svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
  }
  .lock-card h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .lock-desc {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
  }
  .lock-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  .lock-input {
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .lock-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
  }
  .lock-submit {
    width: 100%;
    padding: 9px 14px;
    font-size: 13.5px;
  }
  .lock-err {
    color: var(--danger);
    font-size: 12.5px;
    margin-top: 10px;
    min-height: 18px;
  }
  .lock-meta {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }
</style>

<main class="lock-stage">
  <section class="lock-card" aria-labelledby="lockTitle">
    <div style="margin-bottom:14px">
      <span class="p-tag">AES-256-GCM · PBKDF2-SHA256 600k</span>
    </div>
    <div class="lock-head">
      <span class="lock-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      <h1 id="lockTitle">내부 전용 견적 문서</h1>
    </div>
    <p class="lock-desc">이 페이지의 본문은 AES-256-GCM으로 암호화되어 있습니다. 비밀번호를 입력하면 브라우저 내부에서만 복호화됩니다.</p>
    <form id="unlockForm">
      <label class="lock-label" for="pwInput">비밀번호</label>
      <input class="lock-input" id="pwInput" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required autofocus>
      <button class="p-btn primary lock-submit" id="unlockBtn" type="submit">잠금 해제</button>
      <div id="errBox" class="lock-err" role="alert"></div>
    </form>
    <div class="lock-meta">
      <span>외부 업체 전달용 설계 개요·도면·STEP 파일은 상단 메뉴(개요 · 3D 뷰어 · 옵션 · 도면)를 이용하세요.</span>
    </div>
  </section>
</main>

const STORE_KEY = 'lhw_internal_pw_v1';

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function tryDecrypt(pw) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('브라우저 보안 컨텍스트(HTTPS 또는 localhost)에서 열어 주세요.');
  }
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const aesKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(ENC_CFG.s), iterations: ENC_CFG.it, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const buf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(ENC_CFG.iv) },
    aesKey,
    b64ToBytes(ENC_CFG.ct)
  );
  return new TextDecoder().decode(buf);
}

async function unlockWith(pw, fromCache) {
  const btn = document.getElementById('unlockBtn');
  const err = document.getElementById('errBox');
  btn.disabled = true;
  err.textContent = fromCache ? '세션 키로 복호화 중...' : '복호화 확인 중...';
  try {
    const html = await tryDecrypt(pw);
    try { sessionStorage.setItem(STORE_KEY, pw); } catch (_) {}
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    btn.disabled = false;
    if (fromCache) {
      try { sessionStorage.removeItem(STORE_KEY); } catch (_) {}
      err.textContent = '';
    } else {
      err.textContent = (e && e.message && e.message.includes('보안 컨텍스트'))
        ? e.message
        : '비밀번호가 올바르지 않습니다.';
    }
  }
}

document.getElementById('unlockForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const pw = document.getElementById('pwInput').value;
  if (pw) unlockWith(pw, false);
});

try {
  const cached = sessionStorage.getItem(STORE_KEY);
  if (cached) unlockWith(cached, true);
} catch (_) {}
</script>
